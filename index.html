              "addressCountry": "KE"

            "areaServed": [
              { "@type": "Country", "name": "Kenya" },
              { "@type": "City", "name": "Nyeri" },
              { "@type": "City", "name": "Nairobi" },

            "knowsAbout": [
              "Website design",
              "Workflow automation",
              "n8n",
              "WhatsApp business automation",
              "Appointment booking systems",
              "Lead follow-up automation"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Websites and automation",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "priceCurrency": "KES",
                  "price": "45000",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Website",
                    "description": "A one-page website on your own domain, with your photos, prices, hours, location and a WhatsApp button. Hosting and domain handled for the first year."
                  }
                },
                {
                  "@type": "Offer",
                  "priceCurrency": "KES",
                  "price": "58000",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Website + SEO",
                    "description": "A one-page website on your own domain, plus the SEO setup that lets search engines read and list it: structured data, sitemap, Search Console and a claimed Google Business Profile."
                  }
                },
                {
                  "@type": "Offer",
                  "priceCurrency": "KES",
                  "price": "20000",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "SEO Setup",

                },
                {
                  "@type": "Offer",
                  "priceCurrency": "KES",
                  "price": "35000",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Enquiry System",
                    "description": "Automatic replies to enquiries day and night, common questions answered without a person, and anything needing attention sent straight to your phone."

                },
                {
                  "@type": "Offer",
                  "priceCurrency": "KES",
                  "price": "75000",
                  "itemOffered": {
                    "@type": "Service",

              ]
            }

          {
            "@type": "FAQPage",
            "@id": "https://kenya.automationarchitecthq.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How much does a website cost in Kenya?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "KSh 45,000 for a one-page website on your own domain, including hosting and the domain for the first year. With SEO setup so people can find it, KSh 58,000. The Enquiry System that answers messages automatically is KSh 35,000. The full pipeline with automatic follow-up is KSh 75,000. Fixed price, agreed before I start."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need SEO as well?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "If nobody can find the site, it cannot do its job. SEO setup is KSh 20,000 on its own, or KSh 13,000 more when bought with a website, because the technical work overlaps and you should not pay for it twice. What it will not do is promise you position one — nobody can promise that honestly."
                }
              },
              {
                "@type": "Question",
                "name": "How long does it take?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "About a week for a website. Two to three days for the Enquiry System. Five days for the full pipeline. I start the day the deposit lands."
                }
              },
              {
                "@type": "Question",
                "name": "How do I pay?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "50% to start and 50% once it is working, by M-Pesa or bank transfer. The second half is due only after I have shown you the finished thing running with your own details in it."
                }
              },
              {
                "@type": "Question",
                "name": "Do you work outside Nyeri?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. I am based in Nyeri and work with businesses across Kenya — Nairobi, Mombasa and the coast included. Almost all of it is done remotely, so where you are makes no difference to the price."
                }
              },
              {
                "@type": "Question",
                "name": "What if my business already has a website?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Then the question is whether it works. I check whether it loads on a phone, whether search engines can actually see it, and whether enquiries reach you. Plenty of sites are quietly blocking Google or sending emails to an address nobody reads."
                }
              },
              {
                "@type": "Question",
                "name": "What can actually be automated?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Anything repetitive. Answering opening hours and directions, taking booking or appointment requests day and night, chasing people who asked for a price and never heard back, and alerting you the moment something breaks."
                }
              }
            ]
          }
